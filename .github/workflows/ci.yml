name: Performance Tests — K6

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario to run'
        required: false
        default: 'smoke'
        type: choice
        options: [smoke, load, stress, spike, soak]
      environment:
        description: 'Target environment'
        required: false
        default: 'local'
        type: choice
        options: [local, staging]

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Setup K6
        uses: grafana/setup-k6-action@v1

      - name: Run smoke tests (always)
        run: k6 run --out json=results/smoke.json dist/smoke.js
        env:
          AUTH_BASE_URL: ${{ vars.AUTH_BASE_URL || 'http://localhost:8080' }}
          BOARD_BASE_URL: ${{ vars.BOARD_BASE_URL || 'http://localhost:8081' }}
          TEST_EMAIL: ${{ secrets.PERF_TEST_EMAIL || 'perf-test@agentboard.local' }}
          TEST_PASSWORD: ${{ secrets.PERF_TEST_PASSWORD || 'perf-test-123' }}

      - name: Run selected scenario
        if: github.event.inputs.scenario != 'smoke'
        run: k6 run --out json=results/${{ github.event.inputs.scenario }}.json dist/${{ github.event.inputs.scenario }}.js
        env:
          AUTH_BASE_URL: ${{ vars.AUTH_BASE_URL || 'http://localhost:8080' }}
          BOARD_BASE_URL: ${{ vars.BOARD_BASE_URL || 'http://localhost:8081' }}
          TEST_EMAIL: ${{ secrets.PERF_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.PERF_TEST_PASSWORD }}

      - name: Upload K6 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results-${{ github.event.inputs.scenario || 'smoke' }}
          path: results/
          retention-days: 30
